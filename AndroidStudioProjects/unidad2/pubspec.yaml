name: unidad2
description: "Aplicación de Registro con SQLite, Notificaciones y Exportación"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Persistencia de Datos (Base de Datos SQLite)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Notificaciones del Sistema
  flutter_local_notifications: ^17.1.2

  # Funciones Extras: Exportación y Compartir CSV
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true